# 后端发版：推 v* tag → 先跑 test.yml → 构建 linux/amd64 + linux/arm64 → 发 GitHub Release，
# 同时用同一批二进制推送多架构镜像 ghcr.io/<owner>/nezha（预发布版本不移动 latest）。
# 构建方式与 README / AGENTS.md 的本地部署一致（CGO_ENABLED=0，纯 Go sqlite），
# 另外嵌入真实前端（fetch-frontends.sh）与 IPInfo GeoIP 库——本地构建时 pkg/geoip/geoip.db 只是 5 字节占位。
# 手动触发（workflow_dispatch）只构建 artifact 并试构建镜像，不发版、不推镜像：发版前可先用它验证。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false # 发版不复用 Go 缓存，避免缓存投毒

      - name: Fetch embedded frontends
        # 按 service/singleton/frontend-templates.yaml 的 version 下载 dist.zip；runner 自带 curl / unzip / yq
        run: ./script/fetch-frontends.sh

      - name: Fetch IPInfo GeoIP database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -z "$IPINFO_TOKEN" ]; then
            echo "::error::未配置 secret IPINFO_TOKEN"
            exit 1
          fi
          curl -fsSL --retry 3 -o pkg/geoip/geoip.db \
            "https://ipinfo.io/data/free/country.mmdb?token=${IPINFO_TOKEN}"
          # 防止把错误页或空文件当 mmdb 嵌进二进制
          test "$(stat -c %s pkg/geoip/geoip.db)" -gt 1000000

      - name: Generate swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p out
          for arch in amd64 arm64; do
            bin="dashboard-linux-${arch}"
            GOARCH="$arch" go build -trimpath -tags go_json \
              -ldflags "-s -w -X github.com/nezhahq/nezha/service/singleton.Version=${version}" \
              -o "out/${bin}" ./cmd/dashboard
            (cd out && zip -9 -q "${bin}.zip" "${bin}" && rm "${bin}")
          done
          (cd out && sha256sum -- *.zip > checksums.txt && cat checksums.txt)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-linux
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dashboard-linux
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          # gh 先建 draft、传完资产再发布；同名 release 已存在会失败（不覆盖已发布版本的资产）
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${flags[@]}" \
            out/*.zip out/checksums.txt

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dashboard-linux
          path: out

      - name: Unpack binaries
        # Dockerfile 按 TARGETOS/TARGETARCH 取 dist/dashboard-linux-<arch>
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            unzip -q "out/dashboard-linux-${arch}.zip" -d dist
          done
          ls -l dist

      - name: Compute image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nezha"
          tags="${image}:${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
